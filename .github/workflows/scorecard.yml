name: OpenSSF Scorecard

# Supply-chain security checks (https://scorecard.dev). Results go to the
# Security tab (code scanning) and to the public API behind the README badge.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 1'
  # Re-run when branch protection changes (Branch-Protection check).
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results to the Scorecard API (badge).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
