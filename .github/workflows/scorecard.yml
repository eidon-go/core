name: OpenSSF Scorecard

# Supply-chain security checks (https://scorecard.dev). Results go to the
# Security tab (code scanning) and to the public API behind the README badge.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 1'
  # Re-run when branch protection changes (Branch-Protection check).
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload results to code scanning.
      security-events: write
      # Publish results to the Scorecard API (badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
