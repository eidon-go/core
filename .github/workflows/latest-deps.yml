name: Latest dependencies

# Published modules keep their requirements at the minimum versions they need,
# so clients are never forced into upgrades. This job checks every module
# against the latest versions of its dependencies (nothing is committed), so
# incompatibilities surface here before a client hits them.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: modules
        run: echo "modules=$(scripts/modules.sh --published | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  latest:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    env:
      GOWORK: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Upgrade dependencies (not committed)
        run: |
          go get -u -t ./...
          go mod tidy
          git diff --stat -- go.mod

      - name: Build
        run: go build ./...

      # Test-only tools that lag behind a dependency: the code above was built
      # against the latest version, the tests run against the newest one the
      # tool supports. Drop an entry once the tool catches up.
      # - contrib/sql: pgxmock v4.9 does not compile with pgx >= v5.11
      #   (pgx.Rows.TypeMap, pgx.BatchResults.Tx).
      - name: Hold back dependencies for test tools
        if: matrix.module == 'contrib/sql'
        run: |
          go mod edit -require=github.com/jackc/pgx/v5@v5.10.0
          go mod tidy

      - name: Test
        run: go test -race -count=1 -timeout=5m -short ./...
