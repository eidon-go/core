# SonarQube Cloud Automatic Analysis settings (code quality only; coverage is
# reported to Codecov by CI). Organization and project key come from the
# SonarQube Cloud project, not from this file.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Test files and fixtures are not production code; the unpublished
# integration-test module only holds test helpers.
sonar.exclusions=**/*_test.go,**/testdata/**,internal/integration/**
# Option constructors (WithLogger, WithTracerProvider, WithMeterProvider, …)
# are identical across modules on purpose: docs/contrib-guidelines.md requires
# the same shapes everywhere. Exclude them from duplication detection only;
# they are still analyzed for bugs and code smells. The default propagator is
# copied into every instrumented module on purpose too: core cannot hold otel
# code and modules share no internal packages.
sonar.cpd.exclusions=**/options.go,**/internal/propagator/**
