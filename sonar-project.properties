# SonarQube Cloud analysis, run from CI (.github/workflows/ci.yml, job "sonar").
# Automatic Analysis must be OFF in the project settings: it cannot import
# coverage and conflicts with CI-based analysis.
sonar.organization=eidon-go
sonar.projectKey=eidon-go_core
sonar.projectName=eidon-go/core

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Test files and fixtures are not production code; the unpublished
# integration-test module only holds test helpers.
sonar.exclusions=**/*_test.go,**/testdata/**,internal/integration/**,.coverage/**

# Coverage reports are passed by CI (-Dsonar.go.coverage.reportPaths), one per module.
